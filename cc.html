<h3 style="color:#ff3300;">Creative Commons sú licencie pre internetový obsah.
Autor si vyberie, čo dovolí ostatným robiť.</h3>

<h4 style="color:#ff6600;">
<u>Existuje viac typov:</u>
</h4>
<ul style="color:#ffffff;">
<li>CC BY → treba uviesť autora</li>
<li>CC BY-NC → iba nekomerčne</li>
<li>CC BY-SA → zdieľaj pod rovnakou licenciou</li>
</ul>

<h4 style="color:#ff6600;">
<strong>Používa sa na:</strong>
</h4>
<ul style="color:#ffffff;">
<li>fotografie</li>
<li>videá</li>
<li>hudbu</li>
</ul>
